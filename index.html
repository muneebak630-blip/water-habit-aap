<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Habit 🌱💧</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f8ff,#f4fff1);color:#17324d;min-height:100vh}
.app{max-width:520px;margin:auto;padding:28px 18px 40px}.card{background:#fff;border-radius:24px;padding:24px;margin-top:18px;box-shadow:0 10px 30px rgba(30,90,120,.12)}
h1{text-align:center;margin:5px 0 6px;font-size:32px}.subtitle{text-align:center;color:#668096;margin:0 0 18px}
.plant{font-size:100px;text-align:center;line-height:1.1}.progress-wrap{height:22px;background:#e8eef2;border-radius:20px;overflow:hidden;margin:15px 0}.progress{height:100%;width:0;background:#43b7e8;border-radius:20px;transition:.4s}
.amount{text-align:center;font-size:25px;font-weight:bold}.goal{text-align:center;color:#718595;margin-top:5px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.buttons button,.custom button,.goal-select{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer;background:#e4f7ff;color:#1676a5}
.custom{display:flex;gap:10px;margin-top:12px}.custom input{flex:1;padding:13px;border:2px solid #e3ebf0;border-radius:14px;font-size:16px}
.goal-row{display:flex;gap:10px;margin-top:15px;align-items:center}.goal-row label{font-size:14px;color:#718595}.goal-select{padding:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{text-align:center;background:#f7fbfd;border-radius:16px;padding:15px}.stat strong{display:block;font-size:24px}
.message{text-align:center;margin-top:14px;font-weight:bold;color:#2b829e}.history{margin-top:18px}.history h3{margin:0 0 10px}.day{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f3;font-size:14px}
.reset{display:block;margin:18px auto 0;border:0;background:none;color:#8a9aa6;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<h1>Water Habit 🌱💧</h1>
<p class="subtitle">Grow your plant by drinking water.</p>
<div class="card">
<div class="plant" id="plant">🌱</div>
<div class="progress-wrap"><div class="progress" id="progress"></div></div>
<div class="amount" id="amount">0 mL</div>
<div class="goal">Daily goal: <span id="goalText">2000</span> mL</div>
<div class="buttons"><button onclick="addWater(250)">+ 250 mL</button><button onclick="addWater(500)">+ 500 mL</button></div>
<div class="custom"><input id="customAmount" type="number" min="1" placeholder="Custom mL"><button onclick="addCustom()">Add</button></div>
<div class="goal-row"><label for="goalSelect">Change goal:</label><select id="goalSelect" class="goal-select" onchange="changeGoal(this.value)"><option value="1500">1500 mL</option><option value="2000">2000 mL</option><option value="2500">2500 mL</option><option value="3000">3000 mL</option></select></div>
<div class="message" id="message">Start your day with a glass of water!</div>
</div>
<div class="card">
<div class="stats"><div class="stat"><strong id="percent">0%</strong>Goal reached</div><div class="stat"><strong id="streak">0</strong>Day streak</div></div>
<div class="history"><h3>Recent days</h3><div id="history"></div></div>
<button class="reset" onclick="resetToday()">Reset today's water</button>
</div>
</div>
<script>
const key='waterHabitData', goalKey='waterHabitGoal';
let goal=Number(localStorage.getItem(goalKey)||2000);
let data=JSON.parse(localStorage.getItem(key)||'{"date":"","amount":0,"streak":0,"history":[]}');
if(!Array.isArray(data.history))data.history=[];
function today(){return new Date().toISOString().slice(0,10)}
function save(){localStorage.setItem(key,JSON.stringify(data));localStorage.setItem(goalKey,String(goal))}
function ensureToday(){if(data.date!==today()){if(data.date&&data.amount>0){data.history.unshift({date:data.date,amount:data.amount});data.history=data.history.slice(0,7)}data={date:today(),amount:0,streak:data.streak||0,history:data.history};save()}}
ensureToday();
function addWater(ml){if(!Number.isFinite(ml)||ml<=0)return;const wasComplete=data.amount>=goal;data.amount+=ml;if(!wasComplete&&data.amount>=goal)data.streak+=1;save();render()}
function addCustom(){const v=Number(document.getElementById('customAmount').value);addWater(v);document.getElementById('customAmount').value=''}
function changeGoal(v){goal=Number(v);save();render()}
function resetToday(){data.amount=0;save();render()}
function render(){
document.getElementById('goalText').textContent=goal.toLocaleString();document.getElementById('goalSelect').value=String(goal);
const p=Math.min(100,data.amount/goal*100);document.getElementById('progress').style.width=p+'%';document.getElementById('amount').textContent=data.amount.toLocaleString()+' mL';document.getElementById('percent').textContent=Math.round(p)+'%';document.getElementById('streak').textContent=data.streak;
document.getElementById('plant').textContent=p<25?'🌱':p<50?'🌿':p<75?'🪴':p<100?'🌳':'🌸';
document.getElementById('message').textContent=p>=100?'Daily goal complete! Your plant is thriving! 🌸':p>=75?'Almost there! Keep drinking. 🌳':p>=50?'Great progress! Your plant is growing. 🪴':'Keep going—your plant needs water! 🌱';
const h=document.getElementById('history');h.innerHTML=data.history.length?data.history.map(x=>'<div class="day"><span>'+x.date+'</span><strong>'+x.amount.toLocaleString()+' mL</strong></div>').join(''):'<div class="day"><span>No previous days yet</span><span>💧</span></div>';
}
render();
</script>
</body>
</html>
